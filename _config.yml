############################
# --- Basic settings --- #
############################
title: "Joonseok Yang"
author: JOONSEOK YANG

###############################################
# --- Navigation --- #
###############################################
###############################################
# --- Navigation --- #
###############################################
navbar-links:
  RESEARCH: "research"
  PROJECTS: "projects"
  CV: "cv"

# 기존 navbar 색상 설정 제거 또는 수정
navbar-col: ""
navbar-text-col: ""
navbar-border-col: ""

###########################
# --- Layout & Design --- #
###########################
# Colors
navbar-col: "#EAEAEA"  # Light gray for navigation
navbar-text-col: "#404040"  # Dark gray for text
navbar-border-col: "#DDDDDD"
page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#666666"

# Layout settings
title-on-all-pages: true   # 서브페이지 <title>에 "페이지명 | 사이트명" 형식 적용
round-avatar: false

###########################
# --- Remove Blog Features --- #
###########################
paginate: 0
post_search: false
feed_show_excerpt: false
feed_show_tags: false

###########################
# --- Exclude Files --- #
###########################
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - _posts/
  - docs/
  # 내부 작업 파일 — 사이트로 복사·공개되면 안 됨
  - cv/
  - pic/
  - scripts/
  - AUDIT.md
  - CLAUDE.md
  # 테마 개발용 잔재
  - Appraisals
  - beautiful-jekyll-theme.gemspec
  - staticman.yml
  - screenshot.png

site-css:
  - "/assets/css/custom.css"
  
title: Joonseok Yang

description: "Joonseok Yang, Assistant Professor in Political Science. Explore my research, publications, and CV."

author: Joonseok Yang
url: "https://joonsyang.github.io"

# SEO 관련 설정 (jekyll-seo-tag가 사용)
lang: en
locale: en_US
social:
  name: Joonseok Yang
  links:
    - https://github.com/joonsyang

# 소셜 카드: 전 페이지 기본 og:image. 이미지가 4:5 세로형이라 twitter:card는 summary
# (작은 정방 썸네일)로 지정 — 1.91:1 전용 og 이미지를 만들면 summary_large_image로 승격 검토.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/profile-800.jpg
      twitter:
        card: summary

# SEO 태그와 사이트맵 활성화
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# 구글 애널리틱스가 있다면 추가
# google_analytics: UA-XXXXXXXXX-X

  
