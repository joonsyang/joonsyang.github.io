# CV Grants 항목과 동기화: "Climate Adaptation Living Lab" (2023--28, PI)
- id: living-lab
  title: "Climate Adaptation Living Lab"
  title_ko: "연세대학교 기후적응 리빙랩 연구사업단"
  funder: "Yonsei University"
  program:
  role: "Principal Investigator"
  period: "Mar 2023 – Dec 2028"
  status: active
  summary: "A five-year interdisciplinary program that builds and runs living labs — collaborative spaces where residents, local governments, and firms jointly define adaptation problems and test solutions in place. My work develops the field-experimental design and measures whether participatory adaptation planning changes what people are willing to do and support."
