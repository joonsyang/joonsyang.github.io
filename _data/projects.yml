# CV Grants 항목과 동기화: "Public Preferences and Political Accountability for MNCs' FDI" (2025--27, PI)
- id: fdi-preferences
  title: "Public Preferences and Political Accountability for Multinational Corporations' Foreign Direct Investment"
  title_ko: "다국적 기업의 해외직접투자에 대한 대중 선호와 정치 책임성"
  funder: "National Research Foundation of Korea"
  program: "Young Researcher Program"
  role: "Principal Investigator"
  period: "Jun 2025 – May 2027"
  status: active
  summary: "Governments compete to attract multinational firms, but we know little about what the public actually wants from that competition, or whether voters hold anyone responsible for the outcome. This project uses conjoint and factorial experiments in South Korea to identify which firm and project attributes drive public support, and whether inbound and outbound investment are judged by different standards."
  related_publications: []   # TODO
  links: []

# CV Grants 항목과 동기화: "Developing the AI Sustainable Innovation Index (YASII)" (2025--26, Co-I)
- id: yasii
  title: "Developing the AI Sustainable Innovation Index (YASII)"
  title_ko: "AI 지속가능혁신의 국가별 측정 지표 개발"
  funder: "AI Innovation Research Institute, Yonsei University"
  program:
  role: "Co-Investigator"
  period: "Nov 2025 – Nov 2026"
  status: active
  summary: "A pilot study measuring how AI innovation is socially accepted and whether that acceptance is sustainable, across Korea, the United States, Japan, and China. I lead the survey design and cross-national comparison, including an experiment testing whether government certification changes public trust in AI systems relative to private self-regulation."
  related_publications: []   # TODO
  links: []

